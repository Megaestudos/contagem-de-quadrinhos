<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Contagem de Quadrinhos Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#6366f1',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.6);
            --secondary: #8b5cf6;
            --secondary-glow: rgba(139, 92, 246, 0.4);
        }
        body { 
            background-color: #020617; 
            color: #f8fafc; 
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.2) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.2) 0px, transparent 50%);
        }
        .glass { 
            background: rgba(15, 23, 42, 0.7); 
            backdrop-filter: blur(40px); 
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .neon-glow { box-shadow: 0 0 30px var(--primary-glow); }
        .neon-text { text-shadow: 0 0 15px var(--primary-glow); }
        
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(50px, -70px) scale(1.2); }
            66% { transform: translate(-40px, 40px) scale(0.8); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob { animation: blob 10s infinite alternate cubic-bezier(0.45, 0, 0.55, 1); }
        .animation-delay-2000 { animation-delay: 2s; }
        .animation-delay-4000 { animation-delay: 4s; }

        .input-premium {
            background: rgba(2, 6, 23, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .input-premium:focus {
            border-color: var(--primary);
            box-shadow: 0 0 20px var(--primary-glow);
            transform: translateY(-2px);
        }
        
        .btn-premium {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            box-shadow: 0 10px 20px -5px var(--primary-glow);
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .btn-premium:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 20px 30px -5px var(--primary-glow);
        }
    </style>
</head>
<body class="font-sans antialiased flex items-center justify-center min-h-screen overflow-hidden px-6">

    <!-- Background Components -->
    <div class="fixed top-0 -left-20 w-[500px] h-[500px] bg-primary/20 rounded-full animate-blob filter blur-[120px]"></div>
    <div class="fixed -bottom-20 -right-20 w-[500px] h-[500px] bg-secondary/20 rounded-full animate-blob animation-delay-2000 filter blur-[120px]"></div>
    <div class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-blue-500/10 rounded-full animate-blob animation-delay-4000 filter blur-[150px]"></div>

    <div class="relative z-10 w-full max-w-lg">
        <div class="text-center mb-12">
            <div class="inline-flex items-center justify-center w-24 h-24 bg-gradient-to-br from-primary to-secondary rounded-[2rem] mb-8 neon-glow rotate-6 hover:rotate-0 transition-transform duration-500">
                <i data-lucide="shield-check" class="text-white w-12 h-12"></i>
            </div>
            <h1 class="text-5xl font-black tracking-tighter italic text-white mb-4">CORE_ACCESS</h1>
            <p class="text-slate-400 font-bold uppercase tracking-[0.3em] text-[10px]">Portal de Autenticação Segura</p>
        </div>

        <div class="glass p-12 rounded-[3.5rem] relative overflow-hidden">
            <div id="loader" class="absolute inset-0 bg-slate-950/90 backdrop-blur-md z-50 flex flex-col items-center justify-center hidden">
                <div class="w-16 h-16 border-4 border-primary/20 border-t-primary rounded-full animate-spin"></div>
                <p class="text-[10px] font-black uppercase tracking-[0.4em] text-primary mt-6 animate-pulse">Iniciando Protocolos</p>
            </div>

            <form id="loginForm" class="space-y-8">
                <div>
                    <label class="block text-[10px] font-black text-slate-500 uppercase tracking-[0.2em] mb-3 ml-2" for="email">User_Identity</label>
                    <div class="relative">
                        <i data-lucide="mail" class="absolute left-5 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-500"></i>
                        <input type="email" id="email" required 
                            class="input-premium w-full text-white pl-14 pr-6 py-5 rounded-2xl outline-none placeholder:text-slate-700 font-bold tracking-tight" 
                            placeholder="admin@enterprise.os">
                    </div>
                </div>
                
                <div>
                    <label class="block text-[10px] font-black text-slate-500 uppercase tracking-[0.2em] mb-3 ml-2" for="password">Security_Key</label>
                    <div class="relative">
                        <i data-lucide="lock" class="absolute left-5 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-500"></i>
                        <input type="password" id="password" required 
                            class="input-premium w-full text-white pl-14 pr-6 py-5 rounded-2xl outline-none placeholder:text-slate-700 font-bold tracking-tight"
                            placeholder="••••••••••••">
                    </div>
                </div>

                <div id="error-msg" class="p-4 bg-red-500/10 border border-red-500/20 text-red-400 text-[9px] font-black uppercase tracking-widest rounded-2xl hidden text-center italic">
                    <i data-lucide="alert-triangle" class="w-3 h-3 inline mr-2"></i> ERROR: Acesso Negado
                </div>

                <button type="submit" 
                    class="btn-premium w-full text-white font-black py-6 rounded-[2rem] text-sm uppercase tracking-[0.2em] flex items-center justify-center gap-4 group">
                    <span>Acessar Dashboard</span>
                    <i data-lucide="chevron-right" class="w-6 h-6 group-hover:translate-x-2 transition-transform"></i>
                </button>
            </form>
        </div>

        <div class="mt-12 flex justify-between items-center px-10">
            <p class="text-[9px] text-slate-600 font-bold uppercase tracking-widest">v2.0 Premium OS</p>
            <div class="flex gap-4">
                <div class="w-1 h-1 bg-slate-800 rounded-full"></div>
                <div class="w-1 h-1 bg-slate-800 rounded-full"></div>
                <div class="w-1 h-1 bg-slate-800 rounded-full"></div>
            </div>
        </div>
    </div>

        <p class="mt-8 text-center text-slate-500 text-sm italic">
            &copy; 2026 Contagem de Quadrinhos Premium OS
        </p>
    </div>

    <!-- Firebase SDK (Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA1QL_UioBdIEqlcTxujW3U6uh3cc0sv6U",
            authDomain: "contagem-de-quadrinhos.firebaseapp.com",
            projectId: "contagem-de-quadrinhos",
            appId: "1:947344780647:web:e062a1f039a169104c53c2"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const form = document.getElementById('loginForm');
        const loader = document.getElementById('loader');
        const errorMsg = document.getElementById('error-msg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;

            loader.classList.remove('hidden');
            errorMsg.classList.add('hidden');

            try {
                await signInWithEmailAndPassword(auth, email, pass);
                window.location.href = "index.html";
            } catch (err) {
                console.error(err);
                loader.classList.add('hidden');
                errorMsg.classList.remove('hidden');
            }
        });
    </script>

    <script>
        window.onload = () => {
            lucide.createIcons();
        };
    </script>
</body>
</html>
