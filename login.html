<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Contagem de Quadrinhos Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#6366f1',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #020617; color: #f8fafc; }
        .glass { background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .neon-glow { box-shadow: 0 0 20px rgba(59, 130, 246, 0.2); }
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob { animation: blob 7s infinite alternate; }
        .animation-delay-2000 { animation-delay: 2s; }
        .animation-delay-4000 { animation-delay: 4s; }
    </style>
</head>
<body class="font-sans antialiased flex items-center justify-center min-h-screen overflow-hidden">

    <!-- Background Blobs -->
    <div class="fixed top-0 -left-4 w-72 h-72 bg-primary/20 rounded-full filter blur-[100px] animate-blob opacity-50"></div>
    <div class="fixed top-0 -right-4 w-72 h-72 bg-secondary/20 rounded-full filter blur-[100px] animate-blob animation-delay-2000 opacity-50"></div>
    <div class="fixed -bottom-8 left-20 w-72 h-72 bg-purple-500/20 rounded-full filter blur-[100px] animate-blob animation-delay-4000 opacity-50"></div>

    <div class="relative z-10 w-full max-w-md px-6 py-12">
        <div class="text-center mb-10">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-primary rounded-2xl mb-6 neon-glow">
                <i data-lucide="shield-check" class="text-white w-8 h-8"></i>
            </div>
            <h1 class="text-3xl font-extrabold tracking-tight text-white mb-2">Acesso Restrito</h1>
            <p class="text-slate-400">Entre com suas credenciais administrativas.</p>
        </div>

        <div class="glass p-8 rounded-3xl shadow-2xl relative overflow-hidden">
            <!-- Loader Overlay -->
            <div id="loader" class="absolute inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex flex-col items-center justify-center hidden">
                <i data-lucide="loader" class="w-10 h-10 text-primary animate-spin mb-4"></i>
                <p class="text-sm font-medium text-slate-300">Validando acesso...</p>
            </div>

            <form id="loginForm" class="space-y-5">
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2" for="email">E-mail</label>
                    <div class="relative">
                        <i data-lucide="mail" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-500"></i>
                        <input type="email" id="email" required 
                            class="w-full bg-slate-900 border border-slate-700 text-white pl-10 pr-4 py-3 rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all placeholder:text-slate-600" 
                            placeholder="admin@empresa.com.br">
                    </div>
                </div>
                
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2" for="password">Senha</label>
                    <div class="relative">
                        <i data-lucide="lock" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-500"></i>
                        <input type="password" id="password" required 
                            class="w-full bg-slate-900 border border-slate-700 text-white pl-10 pr-4 py-3 rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all placeholder:text-slate-600"
                            placeholder="••••••••">
                    </div>
                </div>

                <div id="error-msg" class="p-3 bg-red-500/10 border border-red-500/50 text-red-500 text-xs font-medium rounded-lg hidden text-center">
                    E-mail ou senha incorretos.
                </div>

                <button type="submit" 
                    class="w-full bg-primary hover:bg-blue-600 text-white font-bold py-4 rounded-xl shadow-lg shadow-primary/20 transition-all flex items-center justify-center gap-2 group">
                    <span>Entrar no Sistema</span>
                    <i data-lucide="arrow-right" class="w-5 h-5 group-hover:translate-x-1 transition-transform"></i>
                </button>
            </form>
        </div>

        <p class="mt-8 text-center text-slate-500 text-sm italic">
            &copy; 2026 Contagem de Quadrinhos Premium OS
        </p>
    </div>

    <!-- Firebase SDK (Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA1QL_UioBdIEqlcTxujW3U6uh3cc0sv6U",
            authDomain: "contagem-de-quadrinhos.firebaseapp.com",
            projectId: "contagem-de-quadrinhos",
            appId: "1:947344780647:web:e062a1f039a169104c53c2"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const form = document.getElementById('loginForm');
        const loader = document.getElementById('loader');
        const errorMsg = document.getElementById('error-msg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;

            loader.classList.remove('hidden');
            errorMsg.classList.add('hidden');

            try {
                await signInWithEmailAndPassword(auth, email, pass);
                window.location.href = "index.html";
            } catch (err) {
                console.error(err);
                loader.classList.add('hidden');
                errorMsg.classList.remove('hidden');
            }
        });
    </script>

    <script>
        window.onload = () => {
            lucide.createIcons();
        };
    </script>
</body>
</html>
