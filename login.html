<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Contagem de Quadrinhos Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { primary: '#3b82f6', secondary: '#6366f1' },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        :root { --primary: #3b82f6; --primary-glow: rgba(59, 130, 246, 0.6); --secondary: #8b5cf6; }
        body { background-color: #020617; color: #f8fafc; background-image: radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.2) 0px, transparent 50%), radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.2) 0px, transparent 50%); }
        .glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(40px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .animate-blob { animation: blob 10s infinite alternate cubic-bezier(0.45, 0, 0.55, 1); }
        @keyframes blob { 0% { transform: translate(0,0) scale(1); } 33% { transform: translate(30px,-50px) scale(1.1); } 66% { transform: translate(-20px,20px) scale(0.9); } 100% { transform: translate(0,0) scale(1); } }
        .input-premium { background: rgba(2, 6, 23, 0.8); border: 1px solid rgba(255, 255, 255, 0.05); transition: all 0.3s ease; }
        .input-premium:focus { border-color: var(--primary); box-shadow: 0 0 20px var(--primary-glow); transform: translateY(-2px); }
        .btn-premium { background: linear-gradient(135deg, var(--primary), var(--secondary)); box-shadow: 0 10px 20px -5px var(--primary-glow); transition: all 0.4s ease; }
        .btn-premium:hover { transform: translateY(-3px); box-shadow: 0 20px 30px -5px var(--primary-glow); }
    </style>
</head>
<body class="font-sans antialiased flex items-center justify-center min-h-screen px-4 py-8 relative overflow-hidden">
    <div class="fixed top-0 -left-10 w-96 h-96 bg-primary/20 rounded-full animate-blob blur-3xl"></div>
    <div class="fixed -bottom-10 -right-10 w-96 h-96 bg-secondary/20 rounded-full animate-blob blur-3xl" style="animation-delay: 2s"></div>

    <div class="relative z-10 w-full max-w-[440px]">
        <div class="text-center mb-10">
            <div class="inline-flex items-center justify-center w-20 h-20 bg-gradient-to-br from-primary to-secondary rounded-3xl mb-6 shadow-2xl rotate-3 hover:rotate-0 transition-transform">
                <i data-lucide="shield-check" class="text-white w-10 h-10"></i>
            </div>
            <h1 class="text-4xl font-black tracking-tighter italic text-white mb-2">CORE_ACCESS</h1>
            <p class="text-slate-500 font-bold uppercase tracking-[0.3em] text-[9px]">Autenticação Premium OS</p>
        </div>

        <div class="glass p-8 sm:p-10 rounded-[2.5rem] relative overflow-hidden">
            <div id="loader" class="absolute inset-0 bg-slate-950/90 backdrop-blur-md z-50 flex flex-col items-center justify-center hidden">
                <div class="w-12 h-12 border-4 border-primary/20 border-t-primary rounded-full animate-spin"></div>
                <p class="text-[9px] font-black uppercase tracking-widest text-primary mt-4">Validando...</p>
            </div>

            <form id="loginForm" class="space-y-6">
                <div>
                    <label class="block text-[9px] font-black text-slate-500 uppercase tracking-widest mb-2 ml-1">Identity</label>
                    <div class="relative">
                        <i data-lucide="mail" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500"></i>
                        <input type="email" id="email" required class="input-premium w-full text-white pl-12 pr-4 py-4 rounded-xl outline-none font-bold text-sm" placeholder="usuario@acesso.com">
                    </div>
                </div>
                <div>
                    <label class="block text-[9px] font-black text-slate-500 uppercase tracking-widest mb-2 ml-1">Key</label>
                    <div class="relative">
                        <i data-lucide="lock" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500"></i>
                        <input type="password" id="password" required class="input-premium w-full text-white pl-12 pr-4 py-4 rounded-xl outline-none font-bold text-sm" placeholder="••••••••">
                    </div>
                </div>
                <div id="error-msg" class="p-3 bg-red-500/10 border border-red-500/20 text-red-400 text-[9px] font-black uppercase tracking-widest rounded-xl hidden text-center italic">Acesso Negado</div>
                <button type="submit" class="btn-premium w-full text-white font-black py-5 rounded-2xl text-xs uppercase tracking-widest flex items-center justify-center gap-3">
                    Acessar Sistema <i data-lucide="chevron-right" class="w-4 h-4"></i>
                </button>
            </form>
        </div>
        <p class="mt-10 text-center text-[10px] text-slate-600 font-bold uppercase tracking-widest">&copy; 2026 Admin Panel — Elite Edition</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";
        const firebaseConfig = { apiKey: "AIzaSyA1QL_UioBdIEqlcTxujW3U6uh3cc0sv6U", authDomain: "contagem-de-quadrinhos.firebaseapp.com", projectId: "contagem-de-quadrinhos", appId: "1:947344780647:web:e062a1f039a169104c53c2" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const loader = document.getElementById('loader');
            const errorMsg = document.getElementById('error-msg');
            loader.classList.remove('hidden');
            errorMsg.classList.add('hidden');
            try {
                await signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value);
                window.location.href = "index.html";
            } catch (err) {
                loader.classList.add('hidden');
                errorMsg.classList.remove('hidden');
            }
        });
    </script>
    <script>window.onload = () => lucide.createIcons();</script>
</body>
</html>
